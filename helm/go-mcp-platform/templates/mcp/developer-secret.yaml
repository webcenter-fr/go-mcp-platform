{{- $root := . -}}
{{- $cfg := index .Values.mcpServers "developer" -}}
{{- if and $cfg.enabled (not $cfg.github.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "go-mcp-platform.developerSecretName" $root }}
  labels:
    {{- include "go-mcp-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/component: developer
type: Opaque
data:
{{- $hasData := false }}
{{- range $name, $instance := $cfg.github.instances }}
{{- $hasData = true }}
  github-{{ $name }}-token: {{ required (printf "mcpServers.developer.github.instances.%s.token is required when github.existingSecret is empty" $name) $instance.token | b64enc | quote }}
{{- end }}
{{- if $cfg.engine.cloudToken }}
{{- $hasData = true }}
  dagger-cloud-token: {{ $cfg.engine.cloudToken | b64enc | quote }}
{{- end }}
{{- range $host, $auth := $cfg.engine.registryAuth }}
{{- $hasData = true }}
  registry-{{ $host }}-password: {{ required (printf "mcpServers.developer.engine.registryAuth.%s.password is required" $host) $auth.password | b64enc | quote }}
{{- end }}
{{- if not $hasData }} {}
{{- end }}
{{- end }}
