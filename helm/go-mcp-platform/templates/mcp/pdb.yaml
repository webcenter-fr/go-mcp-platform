{{- $root := . -}}
{{- range $name, $cfg := .Values.mcpServers }}
{{- if and $cfg.enabled $cfg.podDisruptionBudget.enabled (gt (int $cfg.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "go-mcp-platform.fullname" $root }}-{{ $name }}
  labels:
    {{- include "go-mcp-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  minAvailable: {{ $cfg.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "go-mcp-platform.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
---
{{- end }}
{{- end }}
