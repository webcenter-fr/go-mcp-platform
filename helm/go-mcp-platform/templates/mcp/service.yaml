{{- $root := . -}}
{{- range $name, $cfg := .Values.mcpServers }}
{{- if $cfg.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-mcp-platform.fullname" $root }}-{{ $name }}
  labels:
    {{- include "go-mcp-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: {{ $cfg.service.type }}
  ports:
    - name: http
      port: {{ $cfg.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "go-mcp-platform.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
---
{{- end }}
{{- end }}
