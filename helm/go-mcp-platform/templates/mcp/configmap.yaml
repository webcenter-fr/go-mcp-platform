{{- $root := . -}}
{{- range $name, $cfg := .Values.mcpServers }}
{{- if $cfg.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-mcp-platform.fullname" $root }}-{{ $name }}
  labels:
    {{- include "go-mcp-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
data:
  config.yaml: |
{{ include "go-mcp-platform.mcpConfig" (dict "root" $root "name" $name "cfg" $cfg) | indent 4 }}
---
{{- end }}
{{- end }}
