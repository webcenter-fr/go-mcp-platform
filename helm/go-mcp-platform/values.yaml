## @section Global parameters
## @param global.imageRegistry Global image registry override
## @param global.imagePullSecrets Global image pull secrets
##
global:
  imageRegistry: ""
  imagePullSecrets: []

## @section Approval service parameters
## @param approval.enabled Deploy the standalone approval service
## @param approval.image.registry Approval image registry
## @param approval.image.repository Approval image repository
## @param approval.image.tag Approval image tag (defaults to Chart.AppVersion)
## @param approval.image.pullPolicy Approval image pull policy
## @param approval.replicaCount Approval replica count
## @param approval.baseURL Public approval base URL (defaults to the ingress host)
## @param approval.store.type Store backend: memory, file, redis, postgresql or opensearch
## @param approval.store.path File store directory
## @param approval.store.redis.addr Redis address
## @param approval.store.postgresql.dsn PostgreSQL DSN (stored in a Secret)
## @param approval.store.postgresql.existingSecret Existing Secret containing the PostgreSQL DSN
## @param approval.store.postgresql.dsnSecretKey Key in the PostgreSQL DSN Secret
## @param approval.store.opensearch.url OpenSearch URL
## @param approval.persistence.enabled Enable the file-store PVC
## @param approval.persistence.size PVC size
## @param approval.persistence.storageClass PVC storage class
## @param approval.persistence.accessMode PVC access mode
## @param approval.receipt.algorithm Receipt algorithm: HS256, RS256 or EdDSA
## @param approval.receipt.existingSecret Existing Secret containing the receipt secret
## @param approval.receipt.secretKey Key in the receipt Secret
## @param approval.oidc.enabled Enable OIDC browser login
## @param approval.oidc.issuer OIDC issuer URL
## @param approval.oidc.clientID OIDC client ID
## @param approval.oidc.clientSecret OIDC client secret (stored in a Secret)
## @param approval.oidc.existingSecret Existing Secret containing the OIDC client secret
## @param approval.oidc.clientSecretKey Key in the OIDC client secret Secret
## @param approval.oidc.redirectURL OIDC redirect URL
## @param approval.credentials.existingSecret Existing Secret containing the server credential file
## @param approval.credentials.secretKey Key in the server credential Secret
## @param approval.policy.rules Approver policy rules
## @param approval.ingress.enabled Enable the approval Ingress
## @param approval.ingress.className Ingress class name
## @param approval.ingress.host Ingress host
## @param approval.ingress.tls.enabled Enable Ingress TLS
## @param approval.ingress.tls.secretName Ingress TLS secret name
## @param approval.ingress.annotations Ingress annotations
## @param approval.resources Approval resource requests and limits
## @param approval.podDisruptionBudget.enabled Enable the approval PDB
## @param approval.podDisruptionBudget.minAvailable PDB minAvailable
## @param approval.autoscaling.enabled Enable the approval HPA (requires a shared store)
## @param approval.autoscaling.minReplicas HPA minimum replicas
## @param approval.autoscaling.maxReplicas HPA maximum replicas
## @param approval.autoscaling.targetCPUUtilizationPercentage HPA CPU target
## @param approval.networkPolicy.enabled Enable the approval NetworkPolicy
## @param approval.serviceAccount.create Create the approval ServiceAccount
## @param approval.serviceAccount.name Approval ServiceAccount name override
## @param approval.serviceAccount.annotations Approval ServiceAccount annotations
## @param approval.podAnnotations Approval pod annotations
## @param approval.nodeSelector Approval node selector
## @param approval.tolerations Approval tolerations
## @param approval.affinity Approval affinity
## @param approval.securityContext Approval container security context
## @param approval.podSecurityContext Approval pod security context
##
approval:
  enabled: true
  image:
    registry: ghcr.io
    repository: webcenter-fr/go-mcp-platform/approval
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  baseURL: ""
  store:
    type: file
    path: /data
    redis:
      addr: ""
    postgresql:
      dsn: ""
      existingSecret: ""
      dsnSecretKey: postgres-dsn
    opensearch:
      url: ""
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  receipt:
    algorithm: HS256
    existingSecret: ""
    secretKey: receipt-secret
  oidc:
    enabled: false
    issuer: ""
    clientID: ""
    clientSecret: ""
    existingSecret: ""
    clientSecretKey: oidc-client-secret
    redirectURL: ""
  credentials:
    existingSecret: ""
    secretKey: credentials
  policy:
    rules: []
  ingress:
    enabled: false
    className: ""
    host: ""
    tls:
      enabled: false
      secretName: ""
    annotations: {}
  resources: {}
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  networkPolicy:
    enabled: false
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  podSecurityContext: {}

## @section MCP server parameters
## @param mcp.image.registry MCP image registry
## @param mcp.image.repository MCP image repository
## @param mcp.image.tag MCP image tag (defaults to Chart.AppVersion)
## @param mcp.image.pullPolicy MCP image pull policy
## @param mcp.auth.enabled Enable bearer-token authentication
## @param mcp.auth.existingSecret Existing Secret containing the auth token files
## @param mcp.auth.tokens Static auth tokens
## @param mcp.auth.requiredScopes Required token scopes
## @param mcp.authorization.enabled Enable RBAC
## @param mcp.authorization.rules[].groups Groups allowed by the rule
## @param mcp.authorization.rules[].operations Operations allowed by the rule
## @param mcp.approval.enabled Enable out-of-band approval for write tools
## @param mcp.networkPolicy.enabled Enable the MCP NetworkPolicy
## @param mcp.networkPolicy.mcpClientSelector Ingress client selector
## @param mcp.networkPolicy.extraEgress Extra egress rules
## @param mcp.serviceAccount.create Create one ServiceAccount per family
## @param mcp.serviceAccount.name ServiceAccount name override
## @param mcp.serviceAccount.annotations ServiceAccount annotations
## @param mcp.podAnnotations MCP pod annotations
## @param mcp.nodeSelector MCP node selector
## @param mcp.tolerations MCP tolerations
## @param mcp.affinity MCP affinity
## @param mcp.resources MCP resource requests and limits
## @param mcp.securityContext MCP container security context
## @param mcp.podSecurityContext MCP pod security context
##
mcp:
  image:
    registry: ghcr.io
    repository: webcenter-fr/go-mcp-platform/mcp
    tag: ""
    pullPolicy: IfNotPresent
  auth:
    enabled: true
    existingSecret: ""
    tokens: []
    requiredScopes: []
  authorization:
    enabled: true
    rules:
      - groups: []
        operations: [read]
  approval:
    enabled: true
  networkPolicy:
    enabled: false
    mcpClientSelector: {}
    extraEgress: []
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources: {}
  securityContext: {}
  podSecurityContext: {}

