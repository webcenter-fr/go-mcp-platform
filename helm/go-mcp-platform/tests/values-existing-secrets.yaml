approval:
  receipt:
    existingSecret: go-mcp-platform-receipt
  credentials:
    existingSecret: go-mcp-platform-approval-credentials
  oidc:
    enabled: true
    issuer: https://idp.example.com
    clientID: approval
    existingSecret: go-mcp-platform-approval-oidc
    redirectURL: https://approve.example.com/auth/callback
mcp:
  auth:
    existingSecret: go-mcp-platform-mcp-auth
    tokens:
      - name: alice
        user: alice
        tokenKey: alice-token
mcpServers:
  kubernetes:
    existingSecret: go-mcp-platform-kubernetes
    approvalTokenHash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
